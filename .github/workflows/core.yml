name: AWEp2P Workspace CI
# Final validation runs against the rustfmt-clean main tree, native desktop runtime, and network smoke paths, including group delivery.


concurrency:
  group: awe-core-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'core/**'
      - 'apps/**'
      - 'platforms/**'
      - '.github/workflows/core.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'core/**'
      - 'apps/**'
      - 'platforms/**'
      - '.github/workflows/core.yml'

permissions:
  contents: read

jobs:
  rust:
    name: Rust validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Rust workspace formatting
        run: cargo fmt --all -- --check
      - name: Build workspace
        id: build
        run: cargo check --workspace --all-targets
      - name: Report build diagnostics
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          cargo check --workspace --all-targets --message-format=short 2>&1 | grep -E 'error(\[[^]]*\])?:' | head -n 20 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 0
      - name: Run unit and integration tests
        id: tests
        run: cargo test --workspace --all-targets
      - name: Report tests diagnostics
        if: failure() && steps.tests.outcome == 'failure'
        shell: bash
        run: |
          cargo test --workspace --all-targets 2>&1 | grep -E '(^failures:$|^---- |FAILED|panicked at )' | head -n 40 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 0
      - name: Run product smoke test
        id: smoke
        run: cargo test -p awe-node --test product_smoke -- --nocapture
      - name: Report smoke diagnostics
        if: failure() && steps.smoke.outcome == 'failure'
        shell: bash
        run: |
          cargo test -p awe-node --test product_smoke -- --nocapture 2>&1 | grep -E '(FAILED|panicked at |assertion)' | head -n 30 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 0
      - name: Run clippy
        id: clippy
        run: cargo clippy --workspace --all-targets --message-format=short -- -D warnings
      - name: Report clippy diagnostics
        if: failure() && steps.clippy.outcome == 'failure'
        shell: bash
        run: |
          cargo clippy --workspace --all-targets --message-format=short 2>&1 | grep -E 'error(\[[^]]*\])?:' | head -n 20 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          exit 0

  architecture:
    name: Architecture integrity checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Reject unfinished markers
        shell: bash
        run: |
          if grep -RInE 'TODO|FIXME|IMPLEMENT_ME|UNIMPLEMENTED|fake implementation|mock networking|WASM Executed Successfully|signature\.len\(\) >= 16|target_service: _|ND-[0-9A-F]{4}-1000' core apps platforms --exclude-dir=target; then
            echo 'Unfinished implementation marker found.'
            exit 1
          fi
      - name: Verify required platform boundaries
        run: |
          test -f platforms/windows/service.rs
          test -f platforms/linux/daemon.rs
          test -f platforms/android/AndroidManifest.xml
          test -f platforms/aweos/README.md
          test -f core/src/network.rs
          test -f core/src/storage.rs
          test -f core/src/host.rs
          test -f core/src/store.rs
          test -f core/src/messenger.rs
          test -f core/src/registry.rs
