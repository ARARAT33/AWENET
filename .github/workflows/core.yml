name: AWEp2P Workspace CI
# Final validation runs against the rustfmt-clean main tree, native desktop runtime, and network smoke paths, including group delivery.


concurrency:
  group: awe-core-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'core/**'
      - 'apps/**'
      - 'platforms/**'
      - '.github/workflows/core.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'core/**'
      - 'apps/**'
      - 'platforms/**'
      - '.github/workflows/core.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  rust:
    name: Rust validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Rust workspace formatting
        run: cargo fmt --all -- --check
      - name: Build workspace
        id: build
        run: cargo check --workspace --all-targets
      - name: Run unit and integration tests
        id: tests
        run: cargo test --workspace --all-targets
      - name: Run product smoke test
        id: smoke
        run: cargo test -p awe-node --test product_smoke -- --nocapture
      - name: Run clippy
        id: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Publish diagnostics to PR
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo "### CI diagnostics (automated)"
            echo ""
            echo "build=${{ steps.build.outcome }} tests=${{ steps.tests.outcome }} smoke=${{ steps.smoke.outcome }} clippy=${{ steps.clippy.outcome }}"
            echo ""
            echo "environment: $(rustc -V) cargo $(cargo -V 2>&1 | head -n 1)"
            echo ""
            echo "disk: $(df -h . | tail -n 1)"
            echo ""
            echo "#### cargo check (raw tail)"
              echo '```'
              cargo check --workspace --all-targets --message-format=short > diag.txt 2>&1; echo "cargo exit: $?" >> diag.txt
              tail -n 80 diag.txt
              echo '```'
              echo '```'
            if [ "${{ steps.tests.outcome }}" = "failure" ]; then
              echo ""
              echo "#### test failures"
              echo '```'
              cargo test --workspace --all-targets > tests.txt 2>&1; echo "cargo test exit: $?" >> tests.txt
              grep -E -A3 '(^failures:$|^---- |FAILED|panicked at )' tests.txt | head -n 100
              echo '```'
            fi
            if [ "${{ steps.smoke.outcome }}" = "failure" ]; then
              echo ""
              echo "#### product smoke test (tail)"
              echo '```'
              cargo test -p awe-node --test product_smoke -- --nocapture > smoke.txt 2>&1; echo "smoke exit: $?" >> smoke.txt
              tail -n 60 smoke.txt
              echo '```'
            fi
            if [ "${{ steps.clippy.outcome }}" = "failure" ]; then
              echo ""
              echo "#### clippy (tail, colors stripped)"
              echo '```'
              cargo clippy --workspace --all-targets --message-format=short > clippy.txt 2>&1; echo "clippy exit: $?" >> clippy.txt
              sed -i 's/\x1B\[[0-9;]*m//g' clippy.txt || true
              tail -n 120 clippy.txt
              echo '```'
            fi
          } > diagnostics.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file diagnostics.md

  architecture:
    name: Architecture integrity checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Reject unfinished markers
        shell: bash
        run: |
          if grep -RInE 'TODO|FIXME|IMPLEMENT_ME|UNIMPLEMENTED|fake implementation|mock networking|WASM Executed Successfully|signature\.len\(\) >= 16|target_service: _|ND-[0-9A-F]{4}-1000' core apps platforms --exclude-dir=target; then
            echo 'Unfinished implementation marker found.'
            exit 1
          fi
      - name: Verify required platform boundaries
        run: |
          test -f platforms/windows/service.rs
          test -f platforms/linux/daemon.rs
          test -f platforms/android/AndroidManifest.xml
          test -f platforms/aweos/README.md
          test -f core/src/network.rs
          test -f core/src/storage.rs
          test -f core/src/host.rs
          test -f core/src/store.rs
          test -f core/src/messenger.rs
          test -f core/src/registry.rs
