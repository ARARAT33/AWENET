name: AWEp2P Workspace CI

on:
  push:
    branches: [main, 'fix/ci-rustfmt-ebc151f']
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'core/**'
      - 'apps/**'
      - 'platforms/**'
      - '.github/workflows/core.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'core/**'
      - 'apps/**'
      - 'platforms/**'
      - '.github/workflows/core.yml'

permissions:
  contents: read

jobs:
  format-main:
    name: Format Rust workspace on main
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format workspace
        run: cargo fmt --all
      - name: Commit formatter changes
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "Rust workspace is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "chore: format Rust workspace"
          git push origin HEAD:main

  rust:
    needs: format-main
    name: Rust validation (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting of changed Rust files
        shell: bash
        run: |
          files="$(git diff --name-only HEAD^ HEAD -- '*.rs')"
          if [ -n "$files" ]; then
            echo "$files" | xargs rustfmt --edition 2021 --check
          fi
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings

  architecture:
    name: Architecture integrity checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Reject unfinished markers
        shell: bash
        run: |
          if grep -RInE 'TODO|FIXME|IMPLEMENT_ME|UNIMPLEMENTED|fake implementation|mock networking|WASM Executed Successfully|signature\.len\(\) >= 16|target_service: _|ND-[0-9A-F]{4}-1000' core apps platforms --exclude-dir=target; then
            echo 'Unfinished implementation marker found.'
            exit 1
          fi
      - name: Verify required platform boundaries
        run: |
          test -f platforms/windows/service.rs
          test -f platforms/linux/daemon.rs
          test -f platforms/android/AndroidManifest.xml
          test -f platforms/aweos/README.md
          test -f core/src/network.rs
          test -f core/src/storage.rs
          test -f core/src/host.rs
          test -f core/src/store.rs
          test -f core/src/messenger.rs
          test -f core/src/registry.rs
