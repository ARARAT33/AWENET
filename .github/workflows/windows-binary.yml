name: AWEp2P Windows Binary

on:
  push:
    branches: [main]
    paths-ignore:
      - "bin/**"

permissions:
  contents: read

jobs:
  build-windows:
    if: "!contains(github.event.head_commit.message, '[build-binary]')"
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build AWEp2P
        run: cargo build --release -p awe-node --target x86_64-pc-windows-msvc
      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: AWEp2P-Windows-x64-node
          path: target/x86_64-pc-windows-msvc/release/awe-node.exe
          if-no-files-found: error
