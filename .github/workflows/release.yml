name: AWEp2P Release Packages

on:
  workflow_dispatch:
    inputs:
      release:
    name: Publish GitHub Release
    needs: [package-windows, package-linux, package-linux-arm64, package-macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/awep2p-windows-x86_64.exe
          test -s release-assets/awep2p-linux-x86_64
          test -s release-assets/awep2p-linux-aarch64
          test -s release-assets/awep2p-macos-x86_64
          test -s release-assets/awep2p-macos-aarch64
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AWEp2P ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
