name: AWEp2P Release Packages

on:
  workflow_dispatch:
    inputs:
      release:
        description: Create a GitHub Release from the selected tag
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate:
    name: Validate Rust workspace
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets
      - run: cargo test --workspace --all-targets
      - run: cargo clippy --workspace --all-targets -- -D warnings

  package-desktop:
    name: Native desktop UI (${{ matrix.name }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: desktop-windows-x86_64
          - os: ubuntu-24.04
            name: desktop-linux-x86_64
          - os: macos-13
            name: desktop-macos-x86_64
          - os: macos-14
            name: desktop-macos-aarch64
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux native GUI dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build native desktop UI
        run: cargo build --release -p awe-desktop
      - name: Validate native desktop executable
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="target/release/awep2p-desktop.exe"
            test -x "$BIN"
            file "$BIN" | grep -E 'PE32\\+.*executable|MS Windows'
          elif [ "${{ runner.os }}" = "macOS" ]; then
            BIN="target/release/awep2p-desktop"
            test -x "$BIN"
            file "$BIN" | grep -E 'Mach-O.*executable'
          else
            BIN="target/release/awep2p-desktop"
            test -x "$BIN"
            file "$BIN" | grep -E 'ELF 64-bit.*x86-64'
          fi
      - name: Package clickable native desktop application
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist bundle
          mkdir -p dist bundle
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/awep2p-desktop.exe "dist/AWEp2P.exe"
            sha256sum "dist/AWEp2P.exe" > "dist/AWEp2P.exe.sha256"
          elif [ "${{ runner.os }}" = "macOS" ]; then
            APP="bundle/AWEp2P.app"
            mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
            cp target/release/awep2p-desktop "$APP/Contents/MacOS/AWEp2P"
            chmod +x "$APP/Contents/MacOS/AWEp2P"
            cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleName</key><string>AWEp2P</string>
            <key>CFBundleDisplayName</key><string>AWEp2P</string>
            <key>CFBundleIdentifier</key><string>org.awe.awep2p.desktop</string>
            <key>CFBundleExecutable</key><string>AWEp2P</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>1.0.0</string>
            <key>CFBundleShortVersionString</key><string>1.0.0</string>
          </dict></plist>
          PLIST
            ditto -c -k --sequesterRsrc --keepParent "$APP" "dist/AWEp2P-${{ matrix.name }}.app.zip"
            shasum -a 256 "dist/AWEp2P-${{ matrix.name }}.app.zip" > "dist/AWEp2P-${{ matrix.name }}.app.zip.sha256"
          else
            mkdir -p "bundle/AWEp2P"
            cp target/release/awep2p-desktop "bundle/AWEp2P/AWEp2P"
            chmod +x "bundle/AWEp2P/AWEp2P"
            cat > "bundle/AWEp2P/AWEp2P.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=AWEp2P
          Comment=AWEp2P native P2P desktop application
          Exec=AWEp2P
          Terminal=false
          Categories=Network;
          DESKTOP
            tar -C bundle -czf "dist/AWEp2P-${{ matrix.name }}.tar.gz" AWEp2P
            sha256sum "dist/AWEp2P-${{ matrix.name }}.tar.gz" > "dist/AWEp2P-${{ matrix.name }}.tar.gz.sha256"
          fi
      - name: Validate clickable package
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = "Windows" ]; then
            test -s dist/AWEp2P.exe
          elif [ "${{ runner.os }}" = "macOS" ]; then
            test -s "dist/AWEp2P-${{ matrix.name }}.app.zip"
            unzip -t "dist/AWEp2P-${{ matrix.name }}.app.zip" >/dev/null
          else
            test -s "dist/AWEp2P-${{ matrix.name }}.tar.gz"
            tar -tzf "dist/AWEp2P-${{ matrix.name }}.tar.gz" | grep -F 'AWEp2P/AWEp2P.desktop'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/AWEp2P*
          if-no-files-found: error
  package-windows:
    name: Windows x86_64 executable
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Windows x86_64
        run: cargo build --release -p awe-node --target x86_64-pc-windows-msvc
      - name: Validate real PE executable
        shell: pwsh
        run: |
          $exe = 'target/x86_64-pc-windows-msvc/release/awe-node.exe'
          if (!(Test-Path $exe)) { throw 'Windows executable was not produced' }
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Output is not a valid Windows PE/MZ executable' }
      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item 'target/x86_64-pc-windows-msvc/release/awe-node.exe' 'dist/awep2p-windows-x86_64.exe'
          (Get-FileHash 'dist/awep2p-windows-x86_64.exe' -Algorithm SHA256).Hash.ToLower() + '  awep2p-windows-x86_64.exe' | Set-Content 'dist/awep2p-windows-x86_64.exe.sha256'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: dist/awep2p-windows-x86_64.exe*
          if-no-files-found: error

  package-linux:
    name: Linux x86_64 executable
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Linux x86_64
        run: cargo build --release -p awe-node --target x86_64-unknown-linux-gnu
      - name: Validate real ELF executable
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/x86_64-unknown-linux-gnu/release/awe-node
          test -x "$BIN"
          file "$BIN" | grep -E 'ELF 64-bit.*x86-64'
          readelf -h "$BIN" | grep -E 'Class:.*ELF64|Machine:.*Advanced Micro Devices X86-64'
      - name: Prepare release files
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-gnu/release/awe-node dist/awep2p-linux-x86_64
          chmod +x dist/awep2p-linux-x86_64
          sha256sum dist/awep2p-linux-x86_64 > dist/awep2p-linux-x86_64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/awep2p-linux-x86_64*
          if-no-files-found: error

  package-android:
    name: Android installable APK (${{ matrix.name }})
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
            name: android-arm64
            linker: aarch64-linux-android35-clang
          - target: armv7-linux-androideabi
            abi: armeabi-v7a
            name: android-armv7
            linker: armv7a-linux-androideabi35-clang
          - target: x86_64-linux-android
            abi: x86_64
            name: android-x86_64
            linker: x86_64-linux-android35-clang
    steps:
      - uses: actions/checkout@v5
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK/NDK
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Configure the correct Android NDK linker
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          mkdir -p .cargo
          cat > .cargo/config.toml <<EOF
          [target.aarch64-linux-android]
          linker = "$NDK/aarch64-linux-android35-clang"

          [target.armv7-linux-androideabi]
          linker = "$NDK/armv7a-linux-androideabi35-clang"

          [target.x86_64-linux-android]
          linker = "$NDK/x86_64-linux-android35-clang"
          EOF
          case '${{ matrix.target }}' in
            aarch64-linux-android) echo "CC_aarch64_linux_android=$NDK/aarch64-linux-android35-clang" >> "$GITHUB_ENV" ;;
            armv7-linux-androideabi) echo "CC_armv7_linux_androideabi=$NDK/armv7a-linux-androideabi35-clang" >> "$GITHUB_ENV" ;;
            x86_64-linux-android) echo "CC_x86_64_linux_android=$NDK/x86_64-linux-android35-clang" >> "$GITHUB_ENV" ;;
          esac
          echo "AR_${{ matrix.target }}=$NDK/llvm-ar" >> "$GITHUB_ENV"
      - name: Build Android native executable
        run: cargo build --release -p awe-node --target ${{ matrix.target }}
      - name: Build and sign real Android APK
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD/android-build"
          SDK="$ANDROID_SDK_ROOT"
          BT="$SDK/build-tools/35.0.0"
          PLATFORM="$SDK/platforms/android-35/android.jar"
          ABI='${{ matrix.abi }}'
          NAME='${{ matrix.name }}'

          rm -rf "$ROOT"
          mkdir -p "$ROOT/src/com/awep2p" "$ROOT/res/values" "$ROOT/lib/$ABI" "$ROOT/build/classes" "$ROOT/build/dex"
          cp "target/${{ matrix.target }}/release/awe-node" "$ROOT/lib/$ABI/libawe_node.so"
          chmod 755 "$ROOT/lib/$ABI/libawe_node.so"

          cat > "$ROOT/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.awep2p">
            <uses-sdk android:minSdkVersion="23" android:targetSdkVersion="35" />
            <uses-permission android:name="android.permission.INTERNET" />
            <application android:theme="@style/AppTheme" android:label="AWEp2P" android:allowBackup="false" android:supportsRtl="true" android:extractNativeLibs="true" android:usesCleartextTraffic="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > "$ROOT/res/values/styles.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
              <item name="android:fontFamily">sans</item>
              <item name="android:colorAccent">#6750A4</item>
            </style>
          </resources>
          EOF

          cat > "$ROOT/src/com/awep2p/MainActivity.java" <<'EOF'
          package com.awep2p;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import java.io.*;

          public final class MainActivity extends Activity {
            private WebView webView;
            @Override public void onCreate(Bundle state) {
              super.onCreate(state);
              webView = new WebView(this);
              WebSettings settings = webView.getSettings();
              settings.setJavaScriptEnabled(true);
              settings.setDomStorageEnabled(true);
              webView.setWebViewClient(new WebViewClient());
              setContentView(webView);

              new Thread(new Runnable() { public void run() { launchNodeAndLoadGUI(); } }).start();
            }
            private void launchNodeAndLoadGUI() {
              try {
                File node = new File(getApplicationInfo().nativeLibraryDir, "libawe_node.so");
                if (!node.exists()) throw new IOException("Native executable was not extracted: " + node);
                Process p = new ProcessBuilder(node.getAbsolutePath(), "gui", "41000").redirectErrorStream(true).start();
                Thread.sleep(1500);
                runOnUiThread(new Runnable() { public void run() { webView.loadUrl("http://127.0.0.1:41000"); } });
              } catch (Exception e) {
                final String text = "<html><body style='background:#0b0f19;color:#fff;padding:20px;'><h2>AWEp2P GUI Failed to Start</h2><p>" + e + "</p></body></html>";
                runOnUiThread(new Runnable() { public void run() { webView.loadData(text, "text/html", "UTF-8"); } });
              }
            }
          }
          EOF

          javac -source 8 -target 8 -classpath "$PLATFORM" -d "$ROOT/build/classes" "$ROOT/src/com/awep2p/MainActivity.java"
          "$BT/d8" --lib "$PLATFORM" --min-api 23 --output "$ROOT/build/dex" $(find "$ROOT/build/classes" -name '*.class' -print)
          cp "$ROOT/build/dex/classes.dex" "$ROOT/build/classes.dex"
          "$BT/aapt2" compile --dir "$ROOT/res" -o "$ROOT/build/res.zip"
          "$BT/aapt2" link --min-sdk-version 23 --target-sdk-version 35 --version-code 1 --version-name 0.1.0 --manifest "$ROOT/AndroidManifest.xml" -I "$PLATFORM" -o "$ROOT/build/base.apk" "$ROOT/build/res.zip"

          python3 - "$ROOT/build/base.apk" "$ROOT/lib" "$ROOT/build/classes.dex" "$ROOT/build/unsigned.apk" <<'PY'
          import os, sys, zipfile
          base, libdir, dex, out = sys.argv[1:]
          with zipfile.ZipFile(base, 'r') as zin, zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as zout:
              for item in zin.infolist():
                  zout.writestr(item, zin.read(item.filename))
              zout.write(dex, 'classes.dex')
              for root, _, files in os.walk(libdir):
                  for name in files:
                      path = os.path.join(root, name)
                      arc = os.path.relpath(path, os.path.dirname(libdir))
                      zout.write(path, arc)
          PY

          "$BT/zipalign" -f -p 4 "$ROOT/build/unsigned.apk" "$ROOT/build/aligned.apk"
          keytool -genkeypair -noprompt -keystore "$ROOT/build/awep2p-release.jks" -storepass android -keypass android -alias awep2p -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=AWEp2P, O=AWE, C=AM'
          "$BT/apksigner" sign --ks "$ROOT/build/awep2p-release.jks" --ks-pass pass:android --key-pass pass:android --out "$ROOT/build/$NAME.apk" "$ROOT/build/aligned.apk"
          "$BT/apksigner" verify --verbose "$ROOT/build/$NAME.apk"
          "$BT/aapt2" dump badging "$ROOT/build/$NAME.apk" | grep -F "package: name='com.awep2p'"
          unzip -t "$ROOT/build/$NAME.apk" >/dev/null
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp "$ROOT/build/$NAME.apk" "$GITHUB_WORKSPACE/dist/"
          sha256sum "$GITHUB_WORKSPACE/dist/$NAME.apk" > "$GITHUB_WORKSPACE/dist/$NAME.apk.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}.apk*
          if-no-files-found: error

  package-macos:
    name: macOS executable (${{ matrix.target }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            name: macos-aarch64
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build macOS x86_64 / Apple Silicon
        run: cargo build --release -p awe-node --target ${{ matrix.target }}
      - name: Validate Mach-O executable
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/awe-node"
          test -x "$BIN"
          file "$BIN" | grep -E 'Mach-O.*executable'
      - name: Prepare release files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/awe-node" "dist/awep2p-${{ matrix.name }}"
          chmod +x "dist/awep2p-${{ matrix.name }}"
          shasum -a 256 "dist/awep2p-${{ matrix.name }}" > "dist/awep2p-${{ matrix.name }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/awep2p-${{ matrix.name }}*
          if-no-files-found: error

  package-linux-arm64:
    name: Linux ARM64 executable
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install ARM64 linker
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Build Linux ARM64
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release -p awe-node --target aarch64-unknown-linux-gnu
      - name: Validate ARM64 ELF executable
        shell: bash
        run: |
          set -euo pipefail
          BIN=target/aarch64-unknown-linux-gnu/release/awe-node
          test -x "$BIN"
          file "$BIN" | grep -E 'ELF 64-bit.*ARM aarch64'
      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/aarch64-unknown-linux-gnu/release/awe-node dist/awep2p-linux-aarch64
          chmod +x dist/awep2p-linux-aarch64
          sha256sum dist/awep2p-linux-aarch64 > dist/awep2p-linux-aarch64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: linux-aarch64
          path: dist/awep2p-linux-aarch64*
          if-no-files-found: error
  release:
    name: Publish GitHub Release
    needs: [package-windows, package-linux, package-linux-arm64, package-macos, package-android, package-desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/awep2p-windows-x86_64.exe
          test -s release-assets/AWEp2P.exe
          test -s release-assets/AWEp2P-desktop-linux-x86_64.tar.gz
          test -s release-assets/AWEp2P-desktop-macos-x86_64.app.zip
          test -s release-assets/AWEp2P-desktop-macos-aarch64.app.zip
          test -s release-assets/awep2p-linux-x86_64
          test -s release-assets/awep2p-linux-aarch64
          test -s release-assets/awep2p-macos-x86_64
          test -s release-assets/awep2p-macos-aarch64
          test -s release-assets/android-arm64.apk
          test -s release-assets/android-armv7.apk
          test -s release-assets/android-x86_64.apk
          file release-assets/awep2p-windows-x86_64.exe release-assets/AWEp2P.exe release-assets/awep2p-linux-x86_64 release-assets/*.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AWEp2P ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
