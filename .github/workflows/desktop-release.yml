name: AWEp2P Desktop Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: \${{ matrix.name }}
    runs-on: \${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils build-essential
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: \${{ matrix.target }}
      - name: Build node
        run: cargo build --release -p awe-node --target \${{ matrix.target }}
      - name: Prepare bundled node
        shell: bash
        run: |
          mkdir -p apps/awe-app/src-tauri/binaries
          cp "target/\${{ matrix.target }}/release/awe-node" "apps/awe-app/src-tauri/binaries/awe-node-\${{ matrix.target }}"
      - name: Install app dependencies
        working-directory: apps/awe-app
        run: npm install
      - name: Build native desktop app
        working-directory: apps/awe-app
        run: npx tauri build --ci
      - uses: actions/upload-artifact@v4
        with:
          name: AWEp2P-\${{ matrix.target }}
          path: apps/awe-app/src-tauri/target/release/bundle/**
          if-no-files-found: error

  linux-portable:
    name: Linux x64 portable node
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu
      - run: cargo build --release -p awe-node --target x86_64-unknown-linux-gnu
      - name: Package portable node
        run: |
          mkdir -p package/bin/linux-x86_64
          cp target/x86_64-unknown-linux-gnu/release/awe-node package/bin/linux-x86_64/awe-node
          cp awenet.sh package/awenet.sh
          chmod +x package/bin/linux-x86_64/awe-node package/awenet.sh
          tar -czf AWEP2P-Linux-x64-Portable.tar.gz -C package .
      - uses: actions/upload-artifact@v4
        with:
          name: AWEp2P-Linux-x64-Portable
          path: AWEP2P-Linux-x64-Portable.tar.gz

  publish:
    name: Publish latest desktop release
    needs: [desktop, linux-portable]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums and manifest
        shell: bash
        run: |
          find release -type f -print0 | sort -z | xargs -0 sha256sum > release/SHA256SUMS.txt
          cat > release/RELEASE-MANIFEST.txt <<'EOF'
          AWEp2P latest desktop release
          =============================
          Windows: AWEP2P-Setup-Windows-x64.exe and AWEP2P-Windows-x64-Portable.zip
          Linux: AWEP2P-Linux-x64-Portable.tar.gz plus native Tauri packages
          macOS: native Tauri desktop package
          Build source: main
          EOF
      - name: Publish latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: AWEp2P Latest
          prerelease: false
          make_latest: true
          generate_release_notes: true
          overwrite_files: true
          files: |
            release/**
