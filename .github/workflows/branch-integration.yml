name: Safe branch integration proposal

# Propose one explicitly selected branch as a normal PR. This workflow does
# not scan every branch, enable auto-merge, merge PRs, or delete branches.

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Existing source branch to propose for review
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: branch-proposal
  cancel-in-progress: false

jobs:
  propose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Create a reviewable PR for the selected branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail
          [[ -n "$SOURCE_BRANCH" ]] || { echo "source_branch is required"; exit 1; }
          [[ "$SOURCE_BRANCH" != "$DEFAULT_BRANCH" ]] || {
            echo "The default branch cannot be proposed as its own source"
            exit 1
          }

          branches="$(gh api --paginate "repos/$GH_REPO/branches?per_page=100" --jq '.[].name')"
          if ! grep -Fxq -- "$SOURCE_BRANCH" <<<"$branches"; then
            echo "Source branch does not exist: $SOURCE_BRANCH"
            exit 1
          fi

          existing="$(gh pr list --repo "$GH_REPO" --state open --head "$SOURCE_BRANCH" --base "$DEFAULT_BRANCH" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            echo "An open PR already exists for $SOURCE_BRANCH: #$existing"
            exit 0
          fi

          gh pr create --repo "$GH_REPO" --base "$DEFAULT_BRANCH" --head "$SOURCE_BRANCH" \
            --title "Review branch integration: $SOURCE_BRANCH" \
            --body "Manual integration proposal for branch: $SOURCE_BRANCH. Review the diff, resolve conflicts, and require successful checks before merging. This workflow does not merge the PR or delete the source branch."
