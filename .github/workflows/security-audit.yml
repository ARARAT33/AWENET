name: Security Audit


concurrency:
  group: awe-security-audit-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install cargo-audit
        id: install
        run: |
          set -o pipefail
          cargo install cargo-audit --locked 2>&1 | tee install.log

      - name: Cargo audit
        id: audit
        run: |
          set -o pipefail
          cargo audit 2>&1 | tee audit.log

      - name: Tests
        id: tests
        run: |
          set -o pipefail
          cargo test --locked --workspace 2>&1 | tee tests.log

      - name: Publish diagnostics to PR
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          {
            echo "### Security audit diagnostics (automated)"
            echo ""
            echo "install=${{ steps.install.outcome }} audit=${{ steps.audit.outcome }} tests=${{ steps.tests.outcome }}"
            echo ""
            echo "environment: $(rustc -V) cargo $(cargo -V 2>&1 | head -n 1)"
            if [ -f install.log ]; then
              echo ""
              echo "#### cargo install cargo-audit (tail)"
              echo '```'
              tail -n 60 install.log
              echo '```'
            fi
            if [ -f audit.log ]; then
              echo ""
              echo "#### cargo audit (tail)"
              echo '```'
              tail -n 120 audit.log
              echo '```'
            fi
            if [ -f tests.log ]; then
              echo ""
              echo "#### tests (tail)"
              echo '```'
              tail -n 150 tests.log
              echo '```'
            fi
          } > diagnostics.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file diagnostics.md
